[project]
name = "screen-recorder"
version = "0.1.0"
description = "Rec Studio: grabador de pantalla y editor de video con interfaz aurora-ui"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aurora-ui>=0.3.0",
    "av>=16",
    "dxcam>=0.3.0 ; sys_platform == 'win32'",
    "imageio-ffmpeg>=0.6",
    "mss>=10",
    "numpy>=2.0",
    "pillow>=11",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
    "sounddevice>=0.5",
    "windows-capture>=2.0.1 ; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "aurora-ui[build]>=0.3.0",
    "psutil>=7.2.2",
    "pytest>=8",
]
